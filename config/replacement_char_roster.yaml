# ★U+FFFD 名簿★ — 「既に見た箇所」の名指し (cmd_1394 追補・ashigaru3・2026-07-27)
#
# ■ 之は何か / ★何でないか★
#   ・★之は【既に見た】の名簿である★。★【壊れておらぬ】の証ではない★。
#   ・門 scripts/gate_replacement_char.py は ★此処に名の無い箇所だけを赤で名指す★。
#     ⇒ 緑が言うのは ★「本名簿を据えて以降、新たに焼けた物は無い」★ ただ其れだけ。
#
# ■ ★造りの掟★
#   ・★除外は path と 行の sha256 の【完全一致】のみ★。★pattern の欄は元より無い★
#     = ★将来の本物を匿う道を構造で持たせておらぬ★ (四号 cmd_1400 の設計を借りた)。
#   ・★1 byte でも行が変われば当たらぬ★ = 匿えるのは【今 此処に在る其の行】だけ。
#   ・★門に --seed の口は付けておらぬ★ = ★一手で名簿を塗り替えて新しい焼けを匿う道を作らぬ★。
#     足す時は ★人が 1 件ずつ書く★ (面倒である事が守りである)。
#   ・★sha256 は【行の byte】で採る★ = decode を経由せぬ (decode を経由する形が当の実害を生んだ)。
#   ・★本名簿は U+FFFD の実体を 1 個も持たぬ★ = 名簿が己で分母を汚さぬため。
#
# ■ category (機械は読まぬ。★人が二つの事故を混ぜぬための札★)
#   legitimate   … U+FFFD そのもの／文字化けを【論じ・数え・引用しておる】正当な記録。★直せば証拠が壊れる★。
#   known_damage … ★既に焼けた記録★。★直さぬ★ (元 byte は戻らぬ・推し量らぬ)。
#
# ■ ★連の長さが二族に割れる (2026-07-27 の実測)★
#   ・連長 2〜3 … 多byte 文字が【byte 毎に】置換された跡 (UTF-8 decoder の所業ではない)
#   ・連長 1   … UTF-8 decoder が不正列 1 つを 1 個へ畳んだ形 (四号の ntfy_send.log と同族)
#   ⇒ ★「U+FFFD が在る」で一括りにすると、別々の事故が同じ顔になる★。

