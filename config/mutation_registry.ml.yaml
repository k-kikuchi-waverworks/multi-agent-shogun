# ═══════════════════════════════════════════════════════════════════════════
# mutation_registry.ml.yaml — ★aituber-project-ml 用の【跨ぎ台帳】★ (cmd_1408)
#
# ■ なぜ ml repo の中でなく shogun 側に置くか
#   ml (/mnt/f/aituber-project-ml) は ★Windows 正本★ (memory project_ml_windows_only_canonical)
#   であり、家老の下命は ★「ml へは 1 file も置かぬ」★。
#   ⇒ 台帳だけ shogun 側に置き、runner を --repo-root で跨がせる
#     (先例 = config/mutation_registry.web.yaml / cmd_1374 A-1。台帳 file と repo-root は 1 対 1)。
#
# ■ ★何ゆえ「WSL からは撃てぬ」が誤りであったか (足軽三号 2026-07-27 08:46 実測)★
#   本牙は GPU も 9100/9101 も librosa も要さぬ ★純 python の --selfcheck★ である。
#   WSL から --repo-root で撃ち、変異を当てて赤 (T34 名指し) を 5 秒で見た。
#   ★F: へ 0 byte★ = replay は copy_paths で /tmp の写しへ変異を当てるゆえ、対象 repo を原理的に書かぬ。
#   ⇒ 家老の当初の見立て (乙 = 期限つき免除) は退けた。★守れるのに免除するは「免除は【今は守れぬ】と
#     名乗る行い」に反する★。且つ ★乙は木ごと盲にする★ = 四号が明日 ml へ牙を足しても点呼は黙る。
#
# ■ ★★本台帳の coverage は当面 UNDETERMINED で鳴る (六号 2026-07-27 09:0x 実測・機序は判明済)★★
#   出所は ml ではなく ★runner の内側に「変異試験」の物差しが二つ在り、本 repo では互いに素★ である:
#     ・候補側 (D1/D2/D3)              = selftest 印 ★かつ★ 変異 keyword の共起を要する
#       ⇒ p7 は当たる (`body_selftest()` が `selftest()` に当たり、「変異」も在る)
#       ⇒ p5 は当たらぬ (selftest は在るが「変異」の語が無い)
#     ・台帳側 (_TEST_BODY_RE)          = `def selftest` / `--selftest` / `def test_` / `@test` のみ
#       ⇒ p5 は当たる ⇒ ★p7 は当たらぬ★ (綴りが `def body_selftest` ゆえ)
#   ⇒ 二つの物差しが本 repo で一件も重ならぬゆえ「陽性対照以外を 1 件も見えておらぬ =
#     検出規則が死んでおる疑い」の escalation が鳴る。★規則は現に生きておる (D2 が p7 を捕えた)★。
#   ★実証 (scratch のみ・本番 runner へ 0 byte)★= 台帳側の物差しへ候補側と同じ「変異 keyword」を
#     要求させると ★rc 2 → 0★ (視野は「測れておらぬ」と正しく名乗る)。
#   ★処方の手番は runner の所有者 (足軽三号) にあり、六号は名指しのみ★ (他人の牙の中身は書き換えぬ)。
#
# 掟・書式は config/mutation_registry.yaml および
# scripts/gate_mutation_replay.py 冒頭 docstring を正とする (二重管理せぬ)。
# 実行: python3 scripts/gate_mutation_replay.py \
#         --registry config/mutation_registry.ml.yaml --repo-root "$GATE_ML_ROOT"
# ═══════════════════════════════════════════════════════════════════════════

# --coverage の陽性対照。既定は runner 自身 (gate_mutation_replay.py) だが ml repo には
# 居らぬゆえ、当 repo に実在する牙を対照に据える (web/backend の台帳延長と同じ理由)。
coverage_positive_control: scripts/cmd1349_p7_rvc_both_lungs.py

mutations:
  - id: MUT-1349-P7-001
    origin: cmd_1349
    suspected_by: ashigaru3          # ★案の出所 = 三号 (08:46 に実射 PASS を見た形を其のまま)★
    owner_ack: ashigaru4             # ★牙の所有者 (cmd_1349 P7) の ack を得てから載せた (2026-07-27 08:58)★
    review_by: 2026-08-10            # ★★完了予定日ではない = 【再検分日】である★★ (下記「代償」を其の日に読み直す)
    desc: |
      p7 の「頭の削り上限」の帯 (ONSET_TRIM_CAP_S = 0.65s) を無効化するほど緩めると、
      --selfcheck の G-TRIM T34 (頭 0.90s 削り = 上限の外ゆえ鳴る筈) が黙り、検が赤くなるべき。
      緩めても緑なら ★「9101 が頭を削り過ぎておる」を捕える帯そのものが死んでおる★ =
      削り過ぎた音を「契約どおり」と通す道が開く (p6/p7 の聴き比べの土台が黙って腐る)。
      ⇒ 本 entry は【帯を持つ検】が黙って痩せておらぬかを毎朝検める。
    # ★p5 も要る = p7 が `from cmd1349_p5_body_stats import ...` するゆえ★ (三号 実測・六号 再確認)。
    #   ★之は「変異試験が 2 本」の意ではない★ = 撃つ検は p7 の --selfcheck ただ 1 本である。
    paths:
      - scripts/cmd1349_p7_rvc_both_lungs.py
      - scripts/cmd1349_p5_body_stats.py
    mutate: |
      python3 - <<'PY'
      p = "scripts/cmd1349_p7_rvc_both_lungs.py"
      s = open(p, encoding="utf-8").read()
      old = "ONSET_TRIM_CAP_S = 0.65"
      assert old in s, "mutate の当たり先が見つからぬ (帯の綴りが変わった疑い)"
      s = s.replace(old, "ONSET_TRIM_CAP_S = 99.0", 1)
      open(p, "w", encoding="utf-8").write(s)
      PY
    test: |
      python3 scripts/cmd1349_p7_rvc_both_lungs.py --selfcheck
    expect: nonzero
    # 変異後は T34 が鳴らなくなり、selfcheck が此の語で名指しする。
    # ★「別の理由で偶然赤い」を「変異が効いた」と誤認せぬための名指し検分★。
    red_needle: "T34"
    anchor_sites: 1
    # ★★代償 = 此の牙の緑は【git にも DVC にも無い成果物】に懸かっておる★★ (三号 08:47 実証)
    #   G-SRC が F:/output/cmd1349_p5/{p6_blind_staging/qwen_c1_p6_gen.json, p6_blind/*_D.wav} を読む。
    #   output/ は ml の .gitignore で除外・追跡下に無く・.dvc も無い。
    #   ⇒ ★殿が p6_blind の聴き比べを畳んで掃除なされた日、此の牙は倒れる★。
    #   ⇒ ★★而して倒れる向きは安全側★★ = 黙って緑にはならず rc=2 UNDETERMINED で
    #     「baseline が赤 = 変異前から落ちており検出力を測れぬ」と理由まで名指す (三号 08:48:31 実測)。
    #   ⇒ ★fresh clone では最初から緑にならぬ★ = 此の牙は【此の disk でしか再現せぬ】。
    #   ★review_by 2026-08-10 に決める事★ = ①成果物を archive へ移して牙を可搬にする か
    #     ②cmd_1349 ごと此の entry を退役させる か (四号が cmd_1349 を畳む時に一緒に畳む・四号 ack 済)。
    #   ★四号 ack (08:58) にて申し送り済★ = G-SRC を G-DEPS と同じ流儀 (成果物が無ければ NG とせず
    #     名乗って飛ばす) へ直せば此の牙は可搬になり、上の代償が消える。★四号が直した折に此の註を外す★。
    #     ★但し四号の但し書き = 飛ばした数を必ず印字させよ (黙って飛ばせば
    #      「見張っておらぬ番人が異常なしと報ずる形」= harness 内 SKIP=FAIL と同根)★。
