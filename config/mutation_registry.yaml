# ═══════════════════════════════════════════════════════════════════════════
# mutation_registry.yaml — 変異の台帳 (cmd_1352 gate-2)
#
# 「この変異を当てれば、この試験は必ず赤くなる」という契約の登録簿。
# scripts/gate_mutation_replay.py が全件を再走し、赤くならなくなった変異を名指しする。
#
# ★掟★
#   ・★★entry は【mutations: list の末尾 = 下の `coverage_waivers:` の直前】へ挿せ★★ (cmd_1409)
#     ★file の末尾へ継ぐな★ — 五号 08:15 実測: 末尾へ継いだ entry は mutations: の下に入らず
#     ★最後の top-level key (tree_census_waivers) の値として黙って呑まれる★ =
#     parse は通り・道具も何も申さず・★mutations の総数も動かぬ★ ⇒ ★「登録した」自体が嘘になる★。
#     ★挿した直後に機械へ数えさせよ★: python3 scripts/gate_registry_append.py --count config/mutation_registry.yaml
#     (pre-commit の gate-4 が同じ検分を撃つ。★呑まれは翌朝の replay にも見えぬ★ = 載っておらぬ牙は撃たれもせぬ)
#   ・出所はこの 1 file のみ (二重管理禁 — cmd_1350 の harness順/実機順の食い違いと同型の罠を作るな)
#   ・0 件は PASS ではない (空にする変更をしたなら、その変更こそ疑え)
#   ・entry を外す時は理由を commit log に書け (黙って外すな)
#   ・mutate/test は scratch コピーの上で走る = repo 実体には触れぬ
#   ・変異試験を新設した者は「赤を一度確認した」その変異をここへ登録せよ
#     (登録せねば、次の仕様変更で静かに無効化される — cmd_1330 W0-2 G2 事故の型)
#   ・登録漏れは機械が見ておる (cmd_1352b): gate_mutation_replay.py --coverage が
#     「変異testらしき file が台帳に無い」を毎朝検知し家老へ警告する。免除は下の
#     coverage_waivers へ【理由つきで】書け (黙って外す道は無い)
#   ・red_needle (任意) = 赤の理由が変異を名指ししておるかの検分 (原理(iii)・cmd_1350
#     五号の教訓)。値は【実測した失敗出力】から取れ (推測で書くと偽 FAIL で信頼を失う)
#   ・suspected_by (任意) = ★この変異は誰の疑いを写したものか★ (全軍規律 2026-07-26
#     「己で作った変異は、己が疑うた場所しか撃たぬ」— 五号の申し出を家老が採った)。
#     自作の疑いだけの台帳は盲点が残る — 他者の変異を通した場所が見えれば、
#     ★誰の疑いも通っておらぬ場所★ を数えられる。runner が出所を集計表示する
#
# 書式は scripts/gate_mutation_replay.py 冒頭 docstring を正とする。
# なぜこの台帳が在るか: docs/content/ops/cmd_1352_silent_pitfall_gates.md
# ═══════════════════════════════════════════════════════════════════════════
mutations:
  - id: MUT-1352-001
    origin: cmd_1352
    suspected_by: ashigaru1
    desc: |
      gate-1 の ignore 検出の牙 (git check-ignore 呼び出し) を折ると、gate-1 selftest の
      S2 (cmd_1349 実事故の再現 = .gitignore が dir add から黙って弾く) が赤くなるべき。
      折っても緑なら gate-1 は「弾かれた理由を名指しできぬ飾り」に堕ちておる。
    paths: [scripts/gate_artifact_capture.sh]
    mutate: |
      sed -i 's/check-ignore -q --/check-ignore-neutered -q --/' scripts/gate_artifact_capture.sh
    test: |
      bash scripts/gate_artifact_capture.sh --selftest
    expect: nonzero
    red_needle: "NG S2b"  # 実測 2026-07-26: 牙折り時は S2b (弾いた.gitignore行の名指し検査) が落ちる
    # anchor 絞り (cmd_1382 六号の監査 → 2026-07-26 是正): 旧 anchor 'check-ignore -q' + /g は
    # ★2 箇所★ で発火しておった = 69行目の呼出 (牙の実体) と 63行目の【コメント】。
    # anchor_sites: 2 と申告する道は採らぬ = コメントの書換は挙動に何も関わらず、
    # 「それも意図である」と台帳へ書けば ★嘘を申告する★ ことになるゆえ。
    # '-- ' まで含めて 1 箇所へ絞った (実測 grep -c = 1)。牙は無傷 = 再走で PASS + 名指し「NG S2b」を確認。

  - id: MUT-1352-002
    origin: cmd_1352
    suspected_by: ashigaru1
    desc: |
      gate-1 の「宣言 0 件 = UNDETERMINED」契約を PASS (exit 0) へ倒すと、
      selftest S5 (0件宣言) が赤くなるべき。倒しても緑なら「空の manifest で緑」
      という真空 PASS (cmd_1342 Phase1d で六号が封じた型) が再発する。
    paths: [scripts/gate_artifact_capture.sh]
    mutate: |
      sed -i 's/^EMPTY_UNDETERMINED_EXIT=2$/EMPTY_UNDETERMINED_EXIT=0/' scripts/gate_artifact_capture.sh
    test: |
      bash scripts/gate_artifact_capture.sh --selftest
    expect: nonzero
    red_needle: "NG S5"  # 実測 2026-07-26: 真空PASS化で S5 (0件宣言=UNDETERMINED) が落ちる

  - id: MUT-1352-003
    origin: cmd_1352
    suspected_by: ashigaru1
    desc: |
      gate-2 runner 自身の「変異後も緑 = FAIL」契約 (GREEN_AFTER_MUTATION_IS_FAIL) を
      False へ倒すと、gate-2 selftest の T2 (静かな無効化の検出) が赤くなるべき。
      倒しても緑なら本台帳そのものが飾りになる (gate の gate)。
    # ★cmd_1408 是正 (2026-07-27 07:33 実測・六号)★= ★兄弟 2 本を足した★。
    #   ★paths が本 file 一本きりであった間、runner は其れだけを scratch へ写しておった★。
    #   ★而して --selftest は其の後 育ち、兄弟を読む検が 6 本 生えた★
    #   (T9b / T56 / T57 / T59 / T60b / T64 = gate_bats_negation.py と本台帳を読む)
    #   ⇒ ★一本きりの scratch では其の 6 本が exit 2 を返し baseline が赤★
    #   = ★本 entry は【変異を当てるまでもなく】永久に UNDETERMINED であった★ (毎朝 10 件)。
    #   ★実測★= 一本きり ok=73 ng=6 → ★兄弟込み 79/79 ALL PASS★。
    #   ★★之は「赤を消す」ではなく「申告を実態に合わせる」★★ = 牙が【測れる】状態へ返る。
    paths: [scripts/gate_mutation_replay.py, scripts/gate_bats_negation.py, config/mutation_registry.yaml]
    mutate: |
      sed -i 's/^GREEN_AFTER_MUTATION_IS_FAIL = True$/GREEN_AFTER_MUTATION_IS_FAIL = False/' scripts/gate_mutation_replay.py
    test: |
      python3 scripts/gate_mutation_replay.py --selftest
    expect: nonzero
    red_needle: "NG T2"  # 実測 2026-07-26: 契約無効化で T2 (静かな無効化の検出) が落ちる

