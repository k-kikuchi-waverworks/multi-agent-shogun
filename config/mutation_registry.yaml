# ═══════════════════════════════════════════════════════════════════════════
# mutation_registry.yaml — 変異の台帳 (cmd_1352 gate-2)
#
# 「この変異を当てれば、この試験は必ず赤くなる」という契約の登録簿。
# scripts/gate_mutation_replay.py が全件を再走し、赤くならなくなった変異を名指しする。
#
# ★掟★
#   ・出所はこの 1 file のみ (二重管理禁 — cmd_1350 の harness順/実機順の食い違いと同型の罠を作るな)
#   ・0 件は PASS ではない (空にする変更をしたなら、その変更こそ疑え)
#   ・entry を外す時は理由を commit log に書け (黙って外すな)
#   ・mutate/test は scratch コピーの上で走る = repo 実体には触れぬ
#   ・変異試験を新設した者は「赤を一度確認した」その変異をここへ登録せよ
#     (登録せねば、次の仕様変更で静かに無効化される — cmd_1330 W0-2 G2 事故の型)
#   ・登録漏れは機械が見ておる (cmd_1352b): gate_mutation_replay.py --coverage が
#     「変異testらしき file が台帳に無い」を毎朝検知し家老へ警告する。免除は下の
#     coverage_waivers へ【理由つきで】書け (黙って外す道は無い)
#   ・red_needle (任意) = 赤の理由が変異を名指ししておるかの検分 (原理(iii)・cmd_1350
#     五号の教訓)。値は【実測した失敗出力】から取れ (推測で書くと偽 FAIL で信頼を失う)
#
# 書式は scripts/gate_mutation_replay.py 冒頭 docstring を正とする。
# なぜこの台帳が在るか: docs/content/ops/cmd_1352_silent_pitfall_gates.md
# ═══════════════════════════════════════════════════════════════════════════
mutations:
  - id: MUT-1352-001
    origin: cmd_1352
    desc: |
      gate-1 の ignore 検出の牙 (git check-ignore 呼び出し) を折ると、gate-1 selftest の
      S2 (cmd_1349 実事故の再現 = .gitignore が dir add から黙って弾く) が赤くなるべき。
      折っても緑なら gate-1 は「弾かれた理由を名指しできぬ飾り」に堕ちておる。
    paths: [scripts/gate_artifact_capture.sh]
    mutate: |
      sed -i 's/check-ignore -q/check-ignore-neutered -q/g' scripts/gate_artifact_capture.sh
    test: |
      bash scripts/gate_artifact_capture.sh --selftest
    expect: nonzero
    red_needle: "NG S2b"  # 実測 2026-07-26: 牙折り時は S2b (弾いた.gitignore行の名指し検査) が落ちる

  - id: MUT-1352-002
    origin: cmd_1352
    desc: |
      gate-1 の「宣言 0 件 = UNDETERMINED」契約を PASS (exit 0) へ倒すと、
      selftest S5 (0件宣言) が赤くなるべき。倒しても緑なら「空の manifest で緑」
      という真空 PASS (cmd_1342 Phase1d で六号が封じた型) が再発する。
    paths: [scripts/gate_artifact_capture.sh]
    mutate: |
      sed -i 's/^EMPTY_UNDETERMINED_EXIT=2$/EMPTY_UNDETERMINED_EXIT=0/' scripts/gate_artifact_capture.sh
    test: |
      bash scripts/gate_artifact_capture.sh --selftest
    expect: nonzero
    red_needle: "NG S5"  # 実測 2026-07-26: 真空PASS化で S5 (0件宣言=UNDETERMINED) が落ちる

  - id: MUT-1352-003
    origin: cmd_1352
    desc: |
      gate-2 runner 自身の「変異後も緑 = FAIL」契約 (GREEN_AFTER_MUTATION_IS_FAIL) を
      False へ倒すと、gate-2 selftest の T2 (静かな無効化の検出) が赤くなるべき。
      倒しても緑なら本台帳そのものが飾りになる (gate の gate)。
    paths: [scripts/gate_mutation_replay.py]
    mutate: |
      sed -i 's/^GREEN_AFTER_MUTATION_IS_FAIL = True$/GREEN_AFTER_MUTATION_IS_FAIL = False/' scripts/gate_mutation_replay.py
    test: |
      python3 scripts/gate_mutation_replay.py --selftest
    expect: nonzero
    red_needle: "NG T2"  # 実測 2026-07-26: 契約無効化で T2 (静かな無効化の検出) が落ちる

  - id: MUT-1352-004
    origin: cmd_1352
    desc: |
      gate-1 の head mode (--committed = HEAD blob 正) の捕捉述語 (cat-file -e) を折ると、
      selftest S11-S13 (fresh clone 視点の検分) が赤くなるべき。折っても緑なら
      「commit済と申告したが fresh clone には渡らぬ」を再び見逃す (軍師二号 QC A-O1 の型)。
    paths: [scripts/gate_artifact_capture.sh]
    mutate: |
      sed -i 's/git -C "$1" cat-file -e/git -C "$1" cat-file-neutered -e/' scripts/gate_artifact_capture.sh
    test: |
      bash scripts/gate_artifact_capture.sh --selftest
    expect: nonzero
    red_needle: "NG S11"  # 実測 2026-07-26: head-mode 捕捉述語折りで S11 (commit済=head-PASS) が落ちる

  - id: MUT-1339-001
    origin: cmd_1352b
    desc: |
      idle_revive 停電型 quorum gate の成立下限 (DEFAULT_QUORUM_MIN_STALLED=3) を 999 へ
      引き上げると、T-QRM-001 (4体同時 stall → clear 全面抑止+家老警報1通) が赤くなるべき。
      引き上げても緑なら quorum gate は「全員死んでも個別 clear を撃ち続ける飾り」に堕ちておる
      (2026-07-25 殿 token 切れ全8体同時沈黙=45分閾値素通りの再発)。
      ★本 entry は --coverage 検知層の初回実走が「台帳に無い変異test」として名指しした
      2件のうちの1件の是正である (cmd_1352b)★。
    paths: [scripts/idle_revive_scan.py, tests/unit/test_idle_revive_quorum.bats]
    mutate: |
      sed -i 's/^DEFAULT_QUORUM_MIN_STALLED = 3/DEFAULT_QUORUM_MIN_STALLED = 999/' scripts/idle_revive_scan.py
    test: |
      mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python3
      bats --filter "T-QRM-001" tests/unit/test_idle_revive_quorum.bats
    expect: nonzero
    red_needle: "not ok 1 T-QRM-001"  # 実測 2026-07-26: 赤が quorum 契約 test を名指しする

  - id: MUT-1339-002
    origin: cmd_1352b
    desc: |
      watcher_supervisor の [LEGACY] warn-once 化の marker 書込 (: > "$marker") を消すと、
      T-LEG-001 (12周で [LEGACY] 1行のみ) が赤くなるべき (12行 spam へ退行)。
      消しても緑なら warn-once 契約 (cmd_1339 ③・54行/5分 spam の再発防止) は守られておらぬ。
      ★MUT-1339-001 と同じく --coverage 検知層の初回実走が名指しした未登録変異testの是正★。
    paths: [scripts/watcher_supervisor.sh, tests/unit/test_supervisor_legacy_once.bats]
    mutate: |
      sed -i '/: > "\$marker"/d' scripts/watcher_supervisor.sh
    test: |
      bats --filter "T-LEG-001" tests/unit/test_supervisor_legacy_once.bats
    expect: nonzero
    red_needle: "not ok 1 T-LEG-001"  # 実測 2026-07-26: 赤が warn-once 契約 test を名指しする

  - id: MUT-1352-005
    origin: cmd_1352b
    desc: |
      台帳登録検知層 (--coverage) の変異 keyword 正本 (COVERAGE_MUT_KEYWORDS) を
      決して当たらぬ pattern へ折ると、coverage selftest (T10 未登録の名指し / T11 登録済
      PASS) が赤くなるべき。折っても緑なら「検知層を潰しても誰も気付かぬ」= 本検知層自身が
      沈黙する落とし穴になる (検知層の検知)。
    paths: [scripts/gate_mutation_replay.py]
    mutate: |
      sed -i 's/^COVERAGE_MUT_KEYWORDS = .*/COVERAGE_MUT_KEYWORDS = r"ZZ_NEVER_MATCH_ZZ"/' scripts/gate_mutation_replay.py
    test: |
      python3 scripts/gate_mutation_replay.py --selftest
    expect: nonzero
    red_needle: "NG T10"  # 実測 2026-07-26: keyword 折りで T10 (未登録の名指し) が exit 2 へ落ちる

  - id: MUT-1355-001
    origin: cmd_1355
    desc: |
      idle_revive の上流障害 pattern から "session limit" (2026-07-26 未明に実 pane から
      capture-pane 採取した実文言。tests/fixtures/upstream_session_limit_pane.txt に byte 凍結)
      を外すと、selftest U1b (banner 行単独の検知) が赤くなるべき。外しても緑なら
      枠切れ沈黙が再び idle 固着と誤判定され、治らぬ傷に /clear を撃つ夜 (全軍3h停止・
      軍師二人へ各3連射) が再来する。U1c が対の pattern "/usage-credits" を同様に守る。
    paths: [scripts/idle_revive_scan.py, tests/fixtures/upstream_session_limit_pane.txt]
    mutate: |
      sed -i '/"session limit",/d' scripts/idle_revive_scan.py
    test: |
      python3 scripts/idle_revive_scan.py --selftest-upstream
    expect: nonzero
    red_needle: "★NG★ U1b"  # 実測 2026-07-26: pattern 削除で U1b が banner 行を名指しで落とす

  - id: MUT-1355-002
    origin: cmd_1355
    desc: |
      枠復帰の再開通知 (D) の R2 fallback (resets 時刻を読めなんだ時、初回検知から
      FALLBACK_RESUME_MIN 分で家老へ点検通知) を 999999 分へ折ると、selftest U4d が
      赤くなるべき。折っても緑なら「resets を parse できぬ episode は誰も起こさぬ」=
      2026-07-26 の『枠が 4:30 に戻った後、誰も起こさなかった』の再来経路が開く。
    paths: [scripts/idle_revive_scan.py, tests/fixtures/upstream_session_limit_pane.txt]
    mutate: |
      sed -i 's/^FALLBACK_RESUME_MIN = .*/FALLBACK_RESUME_MIN = 999999/' scripts/idle_revive_scan.py
    test: |
      python3 scripts/idle_revive_scan.py --selftest-upstream
    expect: nonzero
    red_needle: "★NG★ U4d"  # 実測 2026-07-26: fallback 折りで U4d (R2 契約) が名指しで落ちる

  - id: MUT-1355-003
    origin: cmd_1355
    desc: |
      inbox_write.sh の venv fallback (軍師束ねQC具申R2) を折る (fallback 分岐を if false 化)
      と、.venv の無い環境 (fresh clone 相当 = 本 gate の scratch がまさにそれ) での配達 test
      が赤くなるべき。折っても緑なら「復旧シナリオで番人 (idle_revive/gate_nightly) の警報を
      鳴らす経路そのものが 3回 retry 後 LOST する」穴が再発する — 検知を直しても届かねば
      意味が無い (2026-07-26 軍師一号が fresh clone 検分で実測した穴)。
    paths: [scripts/inbox_write.sh]
    mutate: |
      sed -i 's/^if \[ ! -x "\$IW_PYTHON" \]; then$/if false; then/' scripts/inbox_write.sh
    test: |
      bash scripts/inbox_write.sh testagent "fresh clone delivery check" info gate_runner
      grep -q "id: msg_" queue/inbox/testagent.yaml
    expect: nonzero
    red_needle: "message NOT delivered"  # 実測 2026-07-26: fallback 無しは 3retry 後 FATAL LOST

  - id: MUT-1355-004
    origin: cmd_1356
    desc: |
      ★blackout (quorum成立=全軍同時枠切れ) 経路の台帳記録★ (main() blackout 分岐の
      outage_record call = 当該経路で唯一の書込) を削除すると、T-QRM-015 (blackout 4体 →
      台帳4体+検知警報の相乗り) が赤くなるべき。消しても緑なら「殿の枠切れの典型形
      (全軍同時沈黙) では再開通知の入力がゼロ件」= 枠が戻っても誰も起こされぬ
      2026-07-26 全軍3h停止の後半の再来。軍師二号 G-M3 が「消しても selftest PASS +
      bats 全緑 (SURVIVED)」と実証した未検査の是正 (cmd_1356 OBS-2)。
    paths: [scripts/idle_revive_scan.py, tests/unit/test_idle_revive_quorum.bats, tests/fixtures/upstream_session_limit_pane.txt]
    mutate: |
      sed -i '/outage_record(state_dir, s\["agent"\], pat, b_text,/,/task_id=(b_task or {}).get("task_id"))/d' scripts/idle_revive_scan.py
    test: |
      mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python3
      bats --filter "T-QRM-015" tests/unit/test_idle_revive_quorum.bats
    expect: nonzero
    red_needle: "not ok 1 T-QRM-015"  # 実測 2026-07-26: 台帳記録2行削除 (syntax valid 確認済) で台帳file不在を名指しで落とす

  - id: MUT-1355-005
    origin: cmd_1356
    desc: |
      OUTAGE_EXPIRE_HOURS (台帳 episode の消費期限) を 999999 へ折ると、selftest U7a
      (25h 超 episode は close され resume 判定へ進まぬ) が赤くなるべき。折っても緑なら
      stale 台帳が永久に残り「とうに終わった episode の判定が延々続く」腐敗に誰も気付かぬ。
      ★expire は通知をせぬ掃除屋であり『最悪24hで誰かが起こされる』保証ではない —
      起こす保証は R1/R2 (MUT-1355-002/006 が守る)★。軍師二号 G-M5 SURVIVED の是正
      (cmd_1356 OBS-3・docs の「expire=下限保証」の因果も同時に正した)。
    paths: [scripts/idle_revive_scan.py, tests/fixtures/upstream_session_limit_pane.txt]
    mutate: |
      sed -i 's/^OUTAGE_EXPIRE_HOURS = .*/OUTAGE_EXPIRE_HOURS = 999999/' scripts/idle_revive_scan.py
    test: |
      python3 scripts/idle_revive_scan.py --selftest-upstream
    expect: nonzero
    red_needle: "★NG★ U7a"  # 実測 2026-07-26: expire 殺しで U7a/U7b が名指しで落ちる

  - id: MUT-1355-006
    origin: cmd_1356
    desc: |
      ★ETA 妥当域の蓋★ (MAX_RESETS_ETA_AHEAD_HOURS=6・「parse成功だが値が誤り」を使用点で
      R2 へ倒す cmd_1356 の主目的) を 999999 へ折ると、selftest U6a (stale banner の翌日
      誤読 23.8h を R2 が初回検知+60分で引き受ける) が赤くなるべき。折っても緑なら
      「枠切れがリセット45分前より後に始まった夜」(2026-07-26 とほぼ同形・珍しくない) に
      ★23.8時間 誰も起こされぬ★窓が再び開く = guard 導入前より遅い唯一の点の再来
      (軍師二号 OBS-1 実測)。蓋は値を黙って直さぬ = 台帳/警報に生の誤読値が残り続ける
      (U6e が「人が気付ける経路」の生存を守る)。
    paths: [scripts/idle_revive_scan.py, tests/fixtures/upstream_session_limit_pane.txt]
    mutate: |
      sed -i 's/^MAX_RESETS_ETA_AHEAD_HOURS = .*/MAX_RESETS_ETA_AHEAD_HOURS = 999999/' scripts/idle_revive_scan.py
    test: |
      python3 scripts/idle_revive_scan.py --selftest-upstream
    expect: nonzero
    red_needle: "★NG★ U6a"  # 実測 2026-07-26: 蓋殺しで U6a (23.8h窓) / U6f (注記) が名指しで落ちる

# ─────────────────────────────────────────────────────────────────────────────
# coverage_waivers — 台帳登録検知 (--coverage) の免除簿。
#   ・path と reason の両方が必須 (理由なし免除は UNDETERMINED = 曖昧な免除は免除でない)
#   ・免除しても毎朝 [WAIVED] として可視表示される (黙って消える道は無い)
#   ・他 agent 所有の変異test を見つけた時は、勝手に登録せずここへ理由つきで置き、
#     所有者へ登録を申し送るのが筋 (他人の test に mutate を書くのは所有者の手番)
# ─────────────────────────────────────────────────────────────────────────────
coverage_waivers: []
